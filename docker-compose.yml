# Voor ZimaOS: App Store › Eigen app installeren › dit bestand importeren.
name: atlas
services:
  atlas:
    image: ghcr.io/vinceweening/atlas:latest
    # Bij elke (her)installatie de nieuwste versie ophalen.
    pull_policy: always
    container_name: atlas
    restart: unless-stopped
    ports:
      - "8790:8790"
    # Zodat Atlas Frigate en andere apps op dezelfde server kan vinden.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Hier bewaart Atlas de Google-koppeling en je instellingen.
      - atlas-data:/app/data
    environment:
      # Adres van Home Assistant, zoals je het in de browser opent (dus niet localhost).
      HA_URL: "http://192.168.1.10:8123"
      # Langdurige toegangscode uit Home Assistant (Profiel › Beveiliging). Leeg = voorbeeldhuis.
      HA_TOKEN: ""
      # Optioneel: welke camera vooraan staat, bijvoorbeeld camera.voordeur.
      HA_VOORDEUR: ""
      # Google-koppeling (zie README): de client-ID en het clientgeheim van je eigen OAuth-client.
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      # Meldingen (zie README): Atlas zoekt Frigate zelf. Alleen invullen als dat niet lukt, bijvoorbeeld http://192.168.1.10:5000.
      FRIGATE_URL: ""
      # App-blokken (zie README): Atlas vindt de apps zelf, maar voor de inhoud is per app een API-sleutel nodig.
      JELLYFIN_KEY: ""
      SEERR_KEY: ""
      SONARR_KEY: ""
      RADARR_KEY: ""
      # Spraak die thuis blijft (zie README): adres van je eigen Whisper-server, bijvoorbeeld http://host.docker.internal:8000.
      # Leeg = de app gebruikt de spraakherkenning van de browser (werkt niet in de Windows-app).
      WHISPER_URL: ""
      WHISPER_MODEL: "Systran/faster-whisper-small"
      # Optioneel: lokale AI (Ollama) die zinnen herschrijft die de opdrachtbalk niet kent, bijvoorbeeld http://host.docker.internal:11434.
      OLLAMA_URL: ""
      OLLAMA_MODEL: "qwen2.5:3b"

  # Optioneel: een eigen Whisper-server voor spraak. Haal de # weg om hem mee te installeren (ongeveer 1 GB geheugen).
  # whisper:
  #   image: ghcr.io/speaches-ai/speaches:latest-cpu
  #   container_name: atlas-whisper
  #   restart: unless-stopped
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - whisper-modellen:/home/ubuntu/.cache/huggingface/hub

volumes:
  atlas-data:
  # whisper-modellen:
