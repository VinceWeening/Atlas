name: Server-image

on:
  push:
    branches: [main]
  pull_request:
    paths: ['web/**', 'server/**', 'package*.json', 'Dockerfile']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  bouwen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # ZimaOS draait op x86 en ARM-apparaten, dus beide.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: ATLAS_VERSION=${{ github.sha }}
          tags: ghcr.io/vinceweening/atlas:latest
