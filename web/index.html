<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07090D">
<title>Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
</head>
<body>
<div class="app">
  <div class="huis" id="huis" aria-label="Plattegrond, scroll om van verdieping te wisselen"></div>
  <nav class="verdieping-rail huis-bediening" id="verdiepingen" aria-label="Verdiepingen"></nav>

  <div class="stage">
    <section class="gl klok" aria-label="Tijd en weer"><div class="gl-in">
      <svg class="ring" aria-hidden="true" viewBox="0 0 220 220">
        <defs><linearGradient id="arc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D6EDFF"/><stop offset="1" stop-color="#6FA8FF"/></linearGradient></defs>
        <g class="spin"><circle cx="110" cy="110" r="100" fill="none" stroke="rgba(168,216,255,0.4)" stroke-width="3" stroke-dasharray="3 18"/></g>
        <circle cx="110" cy="110" r="80" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="10"/>
        <circle id="dagboog" cx="110" cy="110" r="80" fill="none" stroke="url(#arc)" stroke-width="10" stroke-linecap="round" stroke-dasharray="0 503" transform="rotate(-90 110 110)"/>
      </svg>
      <div>
        <p class="tijd" id="tijd">--:--</p>
        <p class="muted klein"><span id="datum"></span> · <span class="warm" id="weer"></span></p>
      </div>
    </div></section>

    <div class="midden-boven">
      <span class="lbl" id="scherm-label">ATLAS · THUIS</span>
      <div class="knoppen">
        <div class="gl pil"><div class="gl-in segment">
          <button type="button" data-scherm="thuis">Thuis</button>
          <button type="button" data-scherm="overzicht">Overzicht</button>
          <button type="button" data-scherm="apparaten">Apparaten</button>
          <button type="button" data-scherm="cameras">Camera's</button>
        </div></div>
        <div class="gl pil" id="huis-knop-pil" hidden><div class="gl-in segment">
          <button type="button" id="huis-knop" aria-pressed="false"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg><span class="huis-knop-tekst">Huis</span></button>
        </div></div>
        <div class="gl pil huis-bediening"><div class="gl-in segment">
          <button type="button" data-modus="2d">2D</button>
          <button type="button" data-modus="3d">3D</button>
        </div></div>
        <div class="gl pil"><div class="gl-in segment">
          <button type="button" id="tandwiel" aria-label="Instellingen"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        </div></div>
      </div>
    </div>

    <div class="hud" id="hud" data-blok="hud"></div>

    <div class="links">
    <section class="gl vandaag" aria-label="Vandaag" data-blok="vandaag"><div class="gl-in paneel">
      <div class="kop"><h2 class="lbl">VANDAAG</h2><span class="mono muted klein" id="aantal-afspraken"></span></div>
      <div id="agenda"></div>
      <p class="muted klein morgen" id="morgen"></p>
    </div></section>

    <section class="gl belangrijk" aria-label="Belangrijk" data-blok="belangrijk"><div class="gl-in paneel">
      <div class="kop"><h2 class="lbl">BELANGRIJK</h2></div>
      <div id="belangrijk"></div>
    </div></section>
    </div>

    <div class="rechts">
    <section class="gl kamer" aria-label="Kamer" data-blok="kamer"><div class="gl-in paneel">
      <div class="kop"><span class="lbl" id="kamer-label">KAMER</span><select class="kamer-keuze" id="kamer-keuze" aria-label="Kies een ruimte" hidden></select></div>
      <div class="kop"><p class="kamer-naam" id="kamer-naam"></p><p class="mono kamer-temp" id="kamer-temp"></p></div>
      <div id="lampen"></div>
    </div></section>

    <section class="gl app-blok" aria-label="Frigate" data-blok="frigate"><div class="gl-in paneel">
      <div class="kop"><h2 class="lbl">FRIGATE</h2><a class="mono klein app-link" data-app-link="frigate" target="_blank" rel="noopener" hidden>Openen ›</a></div>
      <div id="app-frigate"><p class="muted klein">Laden…</p></div>
    </div></section>
    <section class="gl app-blok" aria-label="Jellyfin" data-blok="jellyfin"><div class="gl-in paneel">
      <div class="kop"><h2 class="lbl">JELLYFIN</h2><a class="mono klein app-link" data-app-link="jellyfin" target="_blank" rel="noopener" hidden>Openen ›</a></div>
      <div id="app-jellyfin"><p class="muted klein">Laden…</p></div>
    </div></section>
    <section class="gl app-blok" aria-label="Seerr" data-blok="seerr"><div class="gl-in paneel">
      <div class="kop"><h2 class="lbl">SEERR</h2><a class="mono klein app-link" data-app-link="seerr" target="_blank" rel="noopener" hidden>Openen ›</a></div>
      <div id="app-seerr"><p class="muted klein">Laden…</p></div>
    </div></section>
    <section class="gl app-blok" aria-label="Downloads" data-blok="downloads"><div class="gl-in paneel">
      <div class="kop"><h2 class="lbl">DOWNLOADS</h2><a class="mono klein app-link" data-app-link="downloads" target="_blank" rel="noopener" hidden>Openen ›</a></div>
      <div id="app-downloads"><p class="muted klein">Laden…</p></div>
    </div></section>
    </div>

    <section class="gl mail" aria-label="Mail" data-blok="mail"><div class="gl-in paneel">
      <div class="kop"><h2 class="lbl">MAIL</h2><span class="mono muted klein" id="mail-aantal"></span></div>
      <div id="mail"></div>
    </div></section>

    <div class="midden-onder">
      <button type="button" class="orb" aria-label="Spraak, komt in fase 3"></button>
      <span class="lbl zacht">"HEY ATLAS" · FASE 3</span>
      <div class="gl pil" id="scenes-pil" data-blok="scenes" hidden><div class="gl-in segment scenes" id="scenes"></div></div>
    </div>

    <section class="gl voordeur" aria-label="Camera" data-blok="camera"><div class="gl-in paneel">
      <div class="kop"><h2 class="lbl">CAMERA</h2><button type="button" class="camera-wissel mono klein" id="camera-wissel" hidden></button></div>
      <div class="camera">
        <img id="camera-beeld" alt="" hidden>
        <span class="chip" hidden><span class="stip"></span><span id="beweging"></span></span>
        <span class="lbl zacht hoek" id="camera-naam">camera</span>
      </div>
    </div></section>

    <section class="pagina" id="pagina-apparaten" aria-label="Apparaten" hidden>
      <div class="pagina-kop">
        <input class="inst-veld pagina-zoek" id="apparaten-zoek" type="search" placeholder="Zoek een apparaat of ruimte" aria-label="Zoek een apparaat of ruimte">
        <div class="gl pil"><div class="gl-in segment inst-chips" id="apparaten-filters"></div></div>
      </div>
      <div class="ruimte-kaarten" id="apparaten-lijst"></div>
    </section>

    <section class="pagina" id="pagina-cameras" aria-label="Camera's" hidden>
      <div class="camera-raster" id="cameras-lijst"></div>
    </section>
  </div>

  <dialog class="gl instellingen camera-groot" id="camera-groot" aria-labelledby="camera-groot-naam"><div class="gl-in paneel">
    <div class="kop"><h2 class="kamer-naam" id="camera-groot-naam"></h2><button type="button" class="knop zacht" id="camera-groot-sluit">Sluiten</button></div>
    <img id="camera-groot-beeld" alt="">
  </div></dialog>

  <dialog class="gl instellingen" id="instellingen" aria-labelledby="instellingen-titel"><div class="gl-in paneel">
    <div class="kop"><h2 class="kamer-naam" id="instellingen-titel">Instellingen</h2><button type="button" class="knop zacht" id="instellingen-sluit">Sluiten</button></div>
    <div id="instellingen-inhoud"></div>
  </div></dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <p class="voorbeeld" id="voorbeeld" hidden>Voorbeeldgegevens · echte koppelingen komen in fase 2</p>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
