<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; color: #F4F6FA;
    background: radial-gradient(50% 45% at 50% 50%, #172030 0%, rgba(23,32,48,0) 100%), #07090D;
  }
  form {
    width: min(440px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 14px; padding: 28px;
    border-radius: 28px; border: 1px solid rgba(255,255,255,0.16);
    background: linear-gradient(180deg, rgba(30,36,48,0.7) 0%, rgba(14,17,24,0.6) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 30px 60px -18px rgba(0,0,0,0.75);
  }
  h1 { margin: 0; font-size: 22px; font-weight: 600; }
  p { margin: 0; font-size: 14px; color: rgba(235,240,248,0.65); line-height: 1.5; }
  label { font-size: 13px; color: rgba(168,216,255,0.85); }
  input {
    height: 44px; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.05); color: inherit; font-size: 15px;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid #A8D8FF; outline-offset: 2px; }
  button { height: 44px; border: 0; border-radius: 22px; background: #A8D8FF; color: #07090D; font-size: 15px; font-weight: 600; cursor: pointer; }
  #melding { min-height: 20px; color: #FFC98A; }
</style>
</head>
<body>
<form id="formulier" hidden>
  <h1>Atlas verbinden</h1>
  <p>Vul het adres van je Atlas-server op ZimaOS in. Via Tailscale werkt dat thuis en onderweg, bijvoorbeeld http://zimaos:8790.</p>
  <label for="adres">Server-adres</label>
  <input id="adres" type="url" required placeholder="http://zimaos:8790" autocomplete="off">
  <button type="submit">Verbinden</button>
  <p id="melding" role="status"></p>
</form>
<script>
  const SLEUTEL = 'atlas-server';
  const formulier = document.getElementById('formulier');
  const invoer = document.getElementById('adres');
  const melding = document.getElementById('melding');

  function opgeslagen() {
    try { return localStorage.getItem(SLEUTEL); } catch { return null; }
  }

  async function bereikbaar(adres) {
    try {
      const antwoord = await fetch(new URL('/api/health', adres), { signal: AbortSignal.timeout(5000) });
      return antwoord.ok;
    } catch { return false; }
  }

  async function verbind(adres) {
    melding.textContent = 'Verbinden...';
    if (!(await bereikbaar(adres))) {
      melding.textContent = 'Atlas reageert niet op dit adres. Staat de server aan en is Tailscale verbonden?';
      formulier.hidden = false;
      return;
    }
    location.replace(adres);
  }

  const adres = opgeslagen();
  invoer.value = adres ?? '';
  if (adres && location.hash !== '#instellen') {
    verbind(adres);
  } else {
    formulier.hidden = false;
  }

  formulier.addEventListener('submit', (e) => {
    e.preventDefault();
    const nieuw = invoer.value.trim().replace(/\/+$/, '');
    try { localStorage.setItem(SLEUTEL, nieuw); } catch {}
    verbind(nieuw);
  });
</script>
</body>
</html>
